[project]
name = "recoup"
version = "0.0.1"
description = "Autonomous receivables recovery agent: the LLM proposes, a deterministic policy engine disposes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.9",
    "anthropic>=1.3",
    "razorpay>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # fastapi.testclient needs it. The webhook is tested offline, so this is
    # how the Phase 4 signature and reconciliation tests run in CI.
    "httpx>=0.27",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
recoup = "recoup.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recoup", "dashboard"]
# Ships the py.typed marker so importers outside src/ (webhook/) see real types.
artifacts = ["src/recoup/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as call-valued defaults. That is the framework idiom.
"src/recoup/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/recoup", "webhook", "dashboard/data.py"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The razorpay SDK ships no type stubs.
module = ["razorpay.*"]
ignore_missing_imports = true
